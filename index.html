<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>6th Grade Math Review Game</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="game-shell">
    <header>
      <h1>6th Grade Math Review Game</h1>
      <p>Single-player quiz: answer questions and see your score.</p>
    </header>

    <section id="start-screen" class="screen active">
      <div class="card">
        <h2>Ready to practice?</h2>
        <p>Click start to begin the math review game.</p>
        <button id="start-button" class="primary-btn">Start Quiz</button>
      </div>
    </section>

    <section id="quiz-screen" class="screen">
      <div class="status-bar">
        <span id="question-count">Question 1 of 15</span>
        <span id="score-count">Score: 0</span>
      </div>
      <div class="card quiz-card">
        <div id="category-name" class="category"></div>
        <div id="question-text" class="question"></div>
        <div id="answers" class="answers"></div>
      </div>
      <button id="next-button" class="secondary-btn" disabled>Next Question</button>
    </section>

    <section id="result-screen" class="screen">
      <div class="card">
        <h2>Quiz Complete!</h2>
        <p id="final-score">You scored 0 out of 15.</p>
        <p id="result-text"></p>
        <button id="restart-button" class="primary-btn">Play Again</button>
      </div>
    </section>
  </div>

  <script src="script.js"></script>
</body>
</html>
